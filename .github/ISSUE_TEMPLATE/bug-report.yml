name: Bug report
description: Create a report to help us improve
title: "[BUG]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
        value: |
            Thanks for submitting a bug report to help us improve.

            If you have a support question about how to use the module, no one is monitoring the issues to answer those. Consider posting on StackOverflow instead using the "passport-saml" tag or using [GitHub Discussions](https://github.com/node-saml/passport-saml/discussions).

            ## Community development model

            `passport-saml` is maintained by a number of current users. There is no author or primary maintainer
            waiting to write tests and documentation or fix bugs for you. To increase the odds that your issue
            is responded to promptly, consider a pull request to address the issue that includes test coverage
            and, where appropriate, updated documentation.
  - type: checkboxes
    id: terms
    attributes:
      label: Due Diligence Check
      options:
        - label: I've checked the [CHANGELOG](https://github.com/node-saml/passport-saml/blob/master/CHANGELOG.md)
          required: true
        - label: I've checked the [Wiki](https://github.com/node-saml/passport-saml/wiki)
          required: true
        - label: I've [searched](https://github.com/node-saml/passport-saml/issues?q=is%3Aissue) for existing issues, including closed ones.
          required: true
  - type: dropdown
    id: upgrade
    attributes:
      label: I've encountered this issue when upgrading from a previous version?
      description: If you are upgrading to a new version, particularly if you are upgrading to a new `semver-major` version, please be sure the problem isn't a configuration issue. All our `semver-major` changes involve breaking change. So, if you are upgrading to a new `semver-major` version, make sure you've carefully read over the CHANGELOG to make sure that your problem isn't a problem with configuration or an API change.
      options:
        - Yes
        - No
    validations:
      required: true
  - type: textarea
    id: relevant_spec
    attributes:
      label: Relevant SAML Spec
      description: |
            This project is focused on compliance with the SAML 2.0 specification. For any bug report that
            involves the SAML spec, please link to the related parts of the spec and quote the passages too.

            Start here: <http://saml.xml.org/saml-specifications>

            You might also check the spec to confirm that it doesn't address your particular bug and mention
            that you found no references in the spec concerning your issue.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      placeholder: Steps to reproduce the behavior. Ideally, expressed through an automated test.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js Version
    validations:
      required: true
  - type: input
    id: passport_version
    attributes:
      label: "`passport-saml` Version"
    validations:
      required: true
  - type: input
    id: idp_documentation
    attributes:
      label: Link to IdP Documentation
    validations:
      required: true
